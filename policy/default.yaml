# Bridgie default policy. Projects override keys in <project>/.bridgie/policy.yaml.
version: 1
retries: { max_attempts: 3 }
swarm: { parallel: 4, default_n: 20, max_n: 100 }   # simulated buyer panel: agents at once, default and ceiling per panel
commit_transcripts: false
# What a task's size adds or drops. Risk sets the floor: a task that builds a requirement tagged at
# or above floor_risk, or that changes a risk path, is never treated as small.
sizes:
  floor_risk: data
  small: { harden: false, skip_tiers: [behavioural, dual_run] }   # one module, no shared state: no hardener, no whole-system tiers
  medium: {}                                                      # what the bet's risk asks for, no more
  large: { harden: true }                                         # shared state, locks, money arithmetic across modules: always hardened
# Decisions a person must answer. Inside an agent (Claude Code, Codex, ...) the command line refuses
# them unless the agent says it is relaying a person's answer (--relayed), and the record says so.
# relay: false refuses the agent outright: the person answers in their own terminal or on bridgie open.
humans_only: { decisions: [accept, governance], relay: true }
# owner_override: the bet's owner may deliver with fewer approvals than policy asks for (bridgie
# accept <slug> --override "<reason>"); the acceptance record says who, why and how many approved.
acceptance: { owner_override: true }
lanes:
  engineering:
    tiers_default: [mechanical, specified, contracts, adversarial]
    approvers: 1
    cross_family: true
    min_confidence_to_sign: anecdote
    by_risk:
      money: { tiers: [mechanical, specified, contracts, invariants, adversarial, behavioural, dual_run], approvers: 2, auto_accept: false, min_confidence_to_sign: data, human_ack_before_build: true, require_numbers: true }
      data: { tiers: [mechanical, specified, contracts, adversarial, behavioural], approvers: 1, auto_accept: false, min_confidence_to_sign: anecdote, human_ack_before_build: true }
      security: { tiers: [mechanical, specified, adversarial, behavioural], approvers: 1, auto_accept: false, min_confidence_to_sign: anecdote, human_ack_before_build: true }
      infra: { tiers: [mechanical, adversarial], approvers: 1, auto_accept: false, min_confidence_to_sign: anecdote, human_ack_before_build: true }
      ux: { tiers: [mechanical, specified, adversarial], approvers: 1, auto_accept: false, min_confidence_to_sign: opinion, human_ack_before_build: false }
      none: { tiers: [mechanical, specified, adversarial], approvers: 1, auto_accept: false, min_confidence_to_sign: opinion, human_ack_before_build: false }
  product:
    tiers_default: [adversarial]
    approvers: 1
    min_confidence_to_sign: anecdote
    by_risk:
      money: { approvers: 1, min_confidence_to_sign: data, require_numbers: true }
  marketing:
    tiers_default: [mechanical, adversarial]
    approvers: 1
    min_confidence_to_sign: opinion
  sales:
    tiers_default: [adversarial]
    approvers: 1
    min_confidence_to_sign: opinion
  platform:
    tiers_default: [mechanical, specified, adversarial]
    approvers: 1
    cross_family: true
    min_confidence_to_sign: anecdote
  security:
    tiers_default: [mechanical, specified, adversarial, behavioural]
    approvers: 1
    cross_family: true
    min_confidence_to_sign: data
routing:
  tiers:
    judgment: { adapter: claude-code, model: opus, effort: xhigh }
    production: { adapter: antigravity, model: argon }
    scout: { adapter: antigravity, model: flash }
    mechanical: { adapter: none }
  seats:
    reviewer: { adapter: codex, model: default }
