# How each verification tier runs for the stacks this lane knows (single-quoted strings).
# Projects override with verify.commands.<tier>: [...] in .bridgie/policy.yaml.
tiers:
  mechanical:
    dotnet: ['dotnet build', 'dotnet test --filter "ArchTests"']
    node: ['npm run lint --if-present', 'npm run build --if-present']
    python: ['python -m compileall -q -x "[.]venv|node_modules|[.]git|[.]bridgie" .']
  specified:
    dotnet: ['dotnet test --filter "UnitTests"']
    node: ['npx vitest run']
    python: ['python -m pytest -q']
  contracts:
    dotnet: ['dotnet test --filter "ContractTests"']
  invariants:
    dotnet: ['dotnet test --filter "PropertyTests"']
