# How each verification tier runs for the stacks this lane knows (single-quoted strings).
# Projects override with verify.commands.<tier>: [...] in .bridgie/policy.yaml.
# "any" commands run for every stack, before the stack's own. {base} is the commit the task
# started from, so the scanners judge the task's own changes and not the code that was already there.
tiers:
  mechanical:
    any:
      - 'gitleaks git --no-banner --redact --log-opts={base}..HEAD'
      - 'semgrep scan --config p/default --severity ERROR --error --metrics=off --quiet --baseline-commit {base}'
    dotnet: ['dotnet build', 'dotnet test --filter "ArchTests"']
    node: ['npm run lint --if-present', 'npm run build --if-present']
  specified:
    dotnet: ['dotnet test --filter "UnitTests" --logger "console;verbosity=normal"']
    node: ['npx vitest run --reporter=verbose']
  contracts:
    dotnet: ['dotnet test --filter "ContractTests" --logger "console;verbosity=normal"']
  invariants:
    dotnet: ['dotnet test --filter "PropertyTests" --logger "console;verbosity=normal"']
  mutation:
    dotnet: ['dotnet stryker --since:{base} --break-at 60']
# How to get a program a lane command needs; shown when verify finds it missing.
install:
  gitleaks: 'brew install gitleaks, or https://github.com/gitleaks/gitleaks#installing'
  semgrep: 'pip install semgrep, or brew install semgrep'
